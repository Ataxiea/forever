name: Run Tests
on:
    # Every pull request, whatever branch it targets, so a pull request into another
    # pull request's branch gets tested and gets its preview too.
    pull_request:
    # Reusable from other workflows (deploy, release). Their runs on master also
    # prime the Go/npm caches that pull request runs restore from.
    workflow_call:
        inputs:
            ref:
                description: 'Commit reference to test (defaults to the triggering ref)'
                required: false
                type: string
            proto_baseline:
                description: 'Commit that TestProtoVersioning diffs the protos against (defaults to remote master)'
                required: false
                type: string
# Runs called from master (deploy, release) have no pull request number; the
# run id keeps each in a group of its own so none is cancelled or queued.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true
jobs:
    build-ui:
        runs-on: self-hosted
        timeout-minutes: 20
        # The preview link comment needs to write to the pull request; every caller of
        # this workflow grants the same.
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}

            - name: Check commit blacklist 🔎
              run: |
                  if grep -q '"rollup/wasm-node"' package.json; then
                    echo "Error: 'rollup/wasm-node' found in package.json"
                    exit 1
                  fi

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x
                  cache: false

            - name: Install Protoc
              uses: arduino/setup-protoc@v3
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22

            - name: Test Locales 💬
              run: |
                  npm ci
                  npm run test:locales

            - name: Check formatting 🎯
              run: npm run fmt

            - name: Lint JS 🧹
              run: npm run lint:js

            - name: Lint CSS 🎨
              run: npm run lint:css

            - name: Generate TS sources 🧬
              run: make ui/generated/proto/api.ts go-to-ts

            - name: Type check 🧠
              run: npm run type-check

            - name: Unit tests 🧪
              run: npm run test:unit

            # The SIML extension bundles ui/sim/siml and generates its grammar from the schema go-to-ts writes, so
            # `check` builds it afresh and fails when the committed build in .vscode/extensions differs.
            - name: Test the SIML extension
              run: |
                  cd tools/vscode-apl
                  npm ci --no-audit --no-fund
                  npm run check
                  npm test

            - name: Build Storybook 📚
              run: npm run storybook:build

            # The checkout's Go files are newer than the committed name table, which the test job's
            # TestTableIsUpToDate already checks, so the stamp marks it current rather than regenerating it here.
            - name: Build 🔧
              run: |
                  touch sim/siml/.names.stamp
                  make dist/forever/.dirstamp

            # Each pull request from this repository gets its build hosted at
            # https://<hash>.wowsims-forever.pages.dev/forever/ as a Cloudflare Pages preview; fork
            # pull requests carry no secrets, so they get none. The hash is an HMAC of the number
            # under DEPLOY_PREVIEW_SALT, so the link stays the same across pushes but neither shows
            # nor can be guessed from the number; preview_cleanup.yml derives the same one. The whole `dist` folder is uploaded because
            # the bundle is built for the `/forever/` base path, and `_redirects` sends the bare
            # host there.
            - name: Deploy preview ☁️
              id: deploy
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.DEPLOY_PREVIEW_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DEPLOY_PREVIEW_ACCOUNT_ID }}
                  DEPLOY_PREVIEW_SALT: ${{ secrets.DEPLOY_PREVIEW_SALT }}
                  NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -o pipefail
                  : "${DEPLOY_PREVIEW_SALT:?is empty, so the preview link would be guessable}"
                  branch="$(printf '%s' "$NUMBER" | openssl dgst -sha256 -hmac "$DEPLOY_PREVIEW_SALT" -r | cut -c1-16)"
                  echo "/ /forever/ 302" > dist/_redirects
                  npx --yes wrangler@4 pages deploy dist \
                    --project-name=wowsims-forever \
                    --branch="$branch" \
                    --commit-hash=${{ github.event.pull_request.head.sha }} \
                    --commit-dirty=true | tee "$RUNNER_TEMP/wrangler-deploy.log"
                  echo "branch=$branch" >> "$GITHUB_OUTPUT"
                  # The per-deployment URL (a hash host, unlike the branch alias) is only in wrangler's output.
                  echo "url=$(grep -o 'https://[a-z0-9]*\.wowsims-forever\.pages\.dev' "$RUNNER_TEMP/wrangler-deploy.log" | head -1)" >> "$GITHUB_OUTPUT"

            # One comment per pull request, found again by its marker and edited on every push, so
            # the link stays in one place instead of repeating. The body is the layout Cloudflare's
            # own GitHub integration posts, with the workflow run as the log link. The pull
            # request's older deployments are deleted first, so only the latest commit's
            # per-deployment URL stays live.
            - name: Comment preview link 🔗
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              uses: actions/github-script@v8
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.DEPLOY_PREVIEW_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DEPLOY_PREVIEW_ACCOUNT_ID }}
                  BRANCH: ${{ steps.deploy.outputs.branch }}
                  DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
              with:
                  script: |
                      const marker = '<!-- preview-link -->';
                      const number = context.payload.pull_request.number;
                      const sha = context.payload.pull_request.head.sha;
                      const branchUrl = `https://${process.env.BRANCH}.wowsims-forever.pages.dev`;
                      const deploymentUrl = process.env.DEPLOYMENT_URL || branchUrl;

                      if (process.env.DEPLOYMENT_URL) {
                          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/wowsims-forever/deployments`;
                          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
                          const call = async (url, method = 'GET') => {
                              const response = await fetch(url, { method, headers });
                              const json = await response.json();
                              if (!json.success) throw new Error(`${method} ${url.replace(process.env.CLOUDFLARE_ACCOUNT_ID, '<account>')}: ${JSON.stringify(json.errors)}`);
                              return json;
                          };
                          const ofThisPullRequest = branch => branch === process.env.BRANCH || branch === `pr-${number}` || branch?.startsWith(`pr-${number}-`);
                          const ids = [];
                          for (let page = 1; ; page++) {
                              const { result, result_info } = await call(`${base}?env=preview&page=${page}`);
                              ids.push(
                                  ...result
                                      .filter(deployment => ofThisPullRequest(deployment.deployment_trigger?.metadata?.branch) && deployment.url !== deploymentUrl)
                                      .map(deployment => deployment.id),
                              );
                              if (!result.length || page >= (result_info?.total_pages ?? page)) break;
                          }
                          // A pr-<number> branch's newest deployment holds that guessable alias, which only `force` lets go of.
                          for (const id of ids) await call(`${base}/${id}?force=true`, 'DELETE');
                          core.info(`Deleted ${ids.length} older deployment(s) of pull request ${number}.`);
                      }
                      const logsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const body = [
                          marker,
                          '## Deploying wowsims-forever with &nbsp;<a href="https://pages.dev"><img alt="Cloudflare Pages" src="https://user-images.githubusercontent.com/23264/106598434-9e719e00-654f-11eb-9e59-6167043cfa01.png" width="16"></a> &nbsp;Cloudflare Pages',
                          '',
                          '<table><tr><td><strong>Latest commit:</strong> </td><td>',
                          `<code>${sha.slice(0, 7)}</code>`,
                          '</td></tr>',
                          '<tr><td><strong>Status:</strong></td><td>&nbsp;✅&nbsp; Deploy successful!</td></tr>',
                          '<tr><td><strong>Preview URL:</strong></td><td>',
                          `<a href='${deploymentUrl}'>${deploymentUrl}</a>`,
                          '</td></tr>',
                          '<tr><td><strong>Branch Preview URL:</strong></td><td>',
                          `<a href='${branchUrl}'>${branchUrl}</a>`,
                          '</td></tr>',
                          '</table>',
                          '',
                          `[View logs](${logsUrl})`,
                      ].join('\n');
                      const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: number, per_page: 100 });
                      const existing = comments.find(comment => comment.body?.startsWith(marker));
                      if (existing) {
                          await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
                      } else {
                          await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
                      }

    test:
        runs-on: self-hosted
        # One shard while there is a single self-hosted runner: four would only queue behind each
        # other, each repeating the setup. Restore the commented lines once there are more runners.
        # timeout-minutes: 30
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                # shard: [0, 1, 2, 3]
                shard: [0]
        steps:
            # Two commits deep, so a pull request's merge commit comes with its first parent, the base branch's
            # commit the name table check reads.
            - name: Checkout 🛎️
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: 2

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x
                  cache: false

            - name: Install Protoc
              uses: arduino/setup-protoc@v3
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22

            # TestProtoVersioning in sim/core shells out to `npx buf`, which needs node_modules.
            - name: Install npm dependencies
              run: npm ci

            - name: Generate proto and dist stubs
              run: make sim/core/proto/api.pb.go binary_dist/dist.go

            # TestTableIsUpToDate regenerates from the table the pull request holds, so it passes a table whose names
            # changed meaning. This fails when a name of the base branch's table means something else, or nothing,
            # unless the pull request adds the name's line to sim/siml/gen/repinned.txt, which simlnames -w -repin
            # writes. A pull request is checked out as its merge commit, whose first parent is the base.
            - name: Check the name table keeps its names
              if: github.event_name == 'pull_request' && matrix.shard == 0
              run: |
                  git rev-parse --verify --quiet HEAD^2 > /dev/null || { echo "HEAD is not the pull request's merge commit"; exit 1; }
                  go run ./sim/siml/cmd/simlnames -base HEAD^1

            # The buff manifest, the proto emitter and the buff generator's render and
            # TS tests need no game files database, and the database is not in the repo, so
            # the tests that do need it skip. One shard runs them.
            - name: Test the buff generator
              if: matrix.shard == 0
              run: go test ./tools/database/... ./tools/gen_buffs_proto/...

            # The tools that read and sim SIML files, wowsimcli's check of the files under ui/specs among them, and
            # sim/siml built without the with_db tag, which holds no name table. The table's up-to-date test runs with
            # ./sim/... below.
            - name: Test the SIML tools
              if: matrix.shard == 0
              run: |
                  go test --tags=with_db ./cmd/wowsimcli/...
                  go test ./sim/siml/...

            - name: Test (shard ${{ matrix.shard }})
              env:
                  GOARCH: amd64
                  # On a master push, master already contains the change under test, so diffing the
                  # protos against master finds nothing and a legitimate version bump fails. The deploy
                  # workflow passes the pre-push commit instead; pull requests keep the master default.
                  PROTO_BASELINE_REF: ${{ inputs.proto_baseline }}
              run: |
                  # go list ./sim/... | awk 'NR % 4 == ${{ matrix.shard }}' | xargs -r go test --tags=with_db
                  go list ./sim/... | awk 'NR % 1 == ${{ matrix.shard }}' | xargs -r go test --tags=with_db
